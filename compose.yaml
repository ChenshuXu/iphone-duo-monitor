services:
  monitor:
    build: .
    image: iphone-duo-monitor:local
    user: '1000:1000'
    init: true
    restart: unless-stopped
    stop_grace_period: 130s
    shm_size: 512m
    mem_limit: 2g
    cpus: 1
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      BARK_KEY: ${BARK_KEY:-}
      GRAFANA_IRM_WEBHOOK: ${GRAFANA_IRM_WEBHOOK:-}
      GRAFANA_IRM_HOST: ${GRAFANA_IRM_HOST:-}
      DATA_DIR: /data
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8080'
    volumes:
      - '${DATA_VOLUME:-monitor-data}:/data'
    healthcheck:
      test: [CMD, node, -e, "require('node:http').get('http://127.0.0.1:8080/api/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
volumes:
  monitor-data:
